<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>籃球電子計分板 (舊設備相容版)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #111111; color: #ffffff; font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
        
        /* 頂部導覽列 */
        .nav-bar { height: 44px; background: rgba(0,0,0,0.6); border-bottom: 1px solid #333; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; padding: 0 10px; position: relative; z-index: 10; }
        .nav-title { font-size: 18px; font-weight: bold; color: #ffcc00; }
        .btn-nav { font-size: 14px; padding: 6px 12px; background-color: #333; border: 1px solid #555; color: white; border-radius: 4px; cursor: pointer; }
        
        /* 主容器 */
        .layout-wrapper { display: -webkit-box; display: -webkit-flex; display: flex; width: 100%; height: calc(100% - 44px); position: relative; }
        .main-page { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; height: 100%; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column; justify-content: space-around; padding: 5px; }
        
        /* 設定頁面 (側邊欄/抽屜) */
        .settings-page { width: 0px; opacity: 0; overflow-y: auto; background-color: #1c1c1e; -webkit-transition: all 0.3s ease; transition: all 0.3s ease; box-sizing: border-box; text-align: left; position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; border-left: 0px solid #333; }
        .layout-wrapper.split-mode .settings-page { width: 300px; opacity: 1; padding: 15px; border-left-width: 2px; position: relative; }
        
        /* 時間顯示區 */
        .timer-section { text-align: center; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 8px; margin-bottom: 5px; }
        .timer-display { font-size: 18vh; font-family: "Courier New", Courier, monospace; color: #ffcc00; font-weight: bold; line-height: 1; }
        
        /* 比分區域 */
        .scoreboard-container { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; width: 100%; }
        .team { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column; -webkit-box-pack: start; -webkit-justify-content: flex-start; justify-content: flex-start; -webkit-box-align: center; -webkit-align-items: center; align-items: center; padding: 2px; }
        
        .team-name { font-size: 4vh; font-weight: bold; margin-bottom: 2px; }
        .home .team-name { color: #ff3b30; }
        .guest .team-name { color: #007aff; }
        
        .score { font-size: 20vh; font-weight: bold; font-family: "Courier New", Courier, monospace; background: #000; border: 2px solid #333; border-radius: 10px; width: 85%; text-align: center; line-height: 1; margin-bottom: 5px; box-shadow: inset 0 0 10px #000; }
        .home .score { color: #ff453a; }
        .guest .score { color: #0a84ff; }
        
        /* 按鈕樣式 */
        .btn-group { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; width: 100%; }
        button.action-btn { font-size: 3.5vh; font-weight: bold; padding: 8px 0; margin: 3px; border: none; border-radius: 6px; cursor: pointer; background-color: #3a3a3c; color: white; width: 28%; min-width: 45px; }
        button.action-btn:active { background-color: #555; }
        
        .btn-start { background-color: #34c759; min-width: 80px; }
        .btn-reset { background-color: #ff3b30; min-width: 80px; }
        .btn-minus { background-color: #48484a; color: #aaa; width: 40%; font-size: 2.5vh; }
        
        /* 設定項樣式 */
        .settings-title { font-size: 18px; font-weight: bold; color: #ffcc00; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .setting-group { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #333; }
        .group-title { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 8px; }
        .setting-item { margin: 8px 0; font-size: 14px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; -webkit-box-align: center; -webkit-align-items: center; align-items: center; }
        .setting-item label { color: #ddd; }
        .setting-item input, .setting-item select { padding: 4px; font-size: 14px; background-color: #2c2c2e; color: white; border: 1px solid #444; border-radius: 4px; width: 110px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <div class="nav-title">籃球電子計分板</div>
        <div>
            <button class="btn-nav" onclick="toggleFullScreen()">全螢幕</button>
            <button class="btn-nav" id="toggleSettingsBtn" onclick="toggleSettingsLayout()">⚙ 設定</button>
        </div>
    </div>

    <div class="layout-wrapper" id="layoutWrapper">
        <!-- 主計分區 -->
        <div class="main-page">
            <div class="timer-section">
                <div id="timer" class="timer-display">10:00</div>
                <div class="btn-group">
                    <button id="startBtn" class="action-btn btn-start" onclick="toggleTimer()">開始</button>
                    <button class="action-btn btn-reset" onclick="resetAll()">重置</button>
                </div>
            </div>

            <div class="scoreboard-container">
                <!-- 主隊 -->
                <div class="team home">
                    <div class="team-name">主隊</div>
                    <div id="homeScore" class="score">0</div>
                    <div class="btn-group">
                        <button class="action-btn" onclick="changeScore('home', 3)">+3</button>
                        <button class="action-btn" onclick="changeScore('home', 2)">+2</button>
                        <button class="action-btn" onclick="changeScore('home', 1)">+1</button>
                    </div>
                    <div class="btn-group" style="margin-top: 4px;">
                        <button class="action-btn btn-minus" onclick="changeScore('home', -1)">-1</button>
                    </div>
                </div>
                
                <!-- 客隊 -->
                <div class="team guest">
                    <div class="team-name">客隊</div>
                    <div id="guestScore" class="score">0</div>
                    <div class="btn-group">
                        <button class="action-btn" onclick="changeScore('guest', 3)">+3</button>
                        <button class="action-btn" onclick="changeScore('guest', 2)">+2</button>
                        <button class="action-btn" onclick="changeScore('guest', 1)">+1</button>
                    </div>
                    <div class="btn-group" style="margin-top: 4px;">
                        <button class="action-btn btn-minus" onclick="changeScore('guest', -1)">-1</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 側欄設定頁面 -->
        <div class="settings-page">
            <div class="settings-title">⚙ 參數與聲響設定</div>
            
            <div class="setting-group">
                <div class="group-title">基本比賽參數</div>
                <div class="setting-item">
                    <label for="cfgTime">每節時間:</label>
                    <div><input type="number" id="cfgTime" value="10" min="1" max="60" style="width:50px;" onchange="updateCustomTime()"> 分鐘</div>
                </div>
                <div class="setting-item">
                    <label for="cfgBgColor">背景顏色:</label>
                    <select id="cfgBgColor" onchange="applyBgColor()">
                        <option value="#111111">經典極黑</option>
                        <option value="#1c1c1e">深灰質感</option>
                        <option value="#0a1128">夜空深藍</option>
                    </select>
                </div>
            </div>

            <div class="setting-group">
                <div class="group-title">警示觸發時間點</div>
                <div class="setting-item">
                    <label for="cfgAlertFreq">分鐘警示:</label>
                    <select id="cfgAlertFreq">
                        <option value="standard">倒數 3, 2, 1 分鐘</option>
                        <option value="every">每分鐘提醒</option>
                    </select>
                </div>
            </div>

            <div class="setting-group">
                <div class="group-title">獨立聲響指派</div>
                <div class="setting-item">
                    <label for="sndMin">分鐘警示:</label>
                    <select id="sndMin">
                        <option value="beepH">高音電子聲</option>
                        <option value="beepL">低音電子聲</option>
                        <option value="bell">雙響上課鐘</option>
                        <option value="boxing">拳擊三連鐘</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="sndSec">10秒倒數:</label>
                    <select id="sndSec">
                        <option value="beepL">低音電子聲</option>
                        <option value="beepH">高音電子聲</option>
                        <option value="bell">雙響上課鐘</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="sndEnd">時間到終場:</label>
                    <select id="sndEnd">
                        <option value="longBeep">終場長鳴</option>
                        <option value="boxing">拳擊三連鐘</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ES5 相容變數宣告
        var scores = { home: 0, guest: 0 };
        var defaultMinutes = 10;
        var timeLeft = defaultMinutes * 60; 
        var timerInterval = null;
        var isRunning = false;

        // Web Audio API 相容性初始化 (支援舊版 iOS Webkit)
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        var audioCtx = null;

        function initAudio() {
            if (!audioCtx && AudioContextClass) {
                audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 聲音發聲核心
        function playTone(freq, type, duration, delay) {
            initAudio();
            if (!audioCtx) return;

            delay = delay || 0;
            setTimeout(function() {
                try {
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(0);
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e) {
                    // 舊型設備聲響異常退化處理
                }
            }, delay);
        }

        function triggerSound(mode) {
            if (mode === 'beepH') playTone(1000, 'sine', 0.15);
            else if (mode === 'beepL') playTone(600, 'sine', 0.15);
            else if (mode === 'longBeep') playTone(800, 'square', 1.5);
            else if (mode === 'bell') { 
                playTone(550, 'sine', 0.3, 0); 
                playTone(550, 'sine', 0.3, 400); 
            }
            else if (mode === 'boxing') { 
                playTone(900, 'triangle', 0.2, 0); 
                playTone(900, 'triangle', 0.2, 300); 
                playTone(900, 'triangle', 0.2, 600); 
            }
        }

        // 計分邏輯
        function changeScore(team, val) {
            initAudio();
            scores[team] += val;
            if (scores[team] < 0) scores[team] = 0;
            document.getElementById(team + 'Score').innerText = scores[team];
            triggerSound(val > 0 ? 'beepH' : 'beepL');
        }

        // 時間顯示與格式化
        function updateTimerDisplay() {
            var mins = Math.floor(timeLeft / 60);
            var secs = timeLeft % 60;
            var strMins = (mins < 10 ? '0' : '') + mins;
            var strSecs = (secs < 10 ? '0' : '') + secs;
            document.getElementById('timer').innerText = strMins + ':' + strSecs;
        }

        // 計時器運作 logic
        function toggleTimer() {
            initAudio();
            var startBtn = document.getElementById('startBtn');
            
            if (isRunning) {
                // 暫停
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                startBtn.innerText = '開始';
                startBtn.style.backgroundColor = '#34c759';
            } else {
                // 開始
                if (timeLeft <= 0) return;
                isRunning = true;
                startBtn.innerText = '暫停';
                startBtn.style.backgroundColor = '#ff9500';

                timerInterval = setInterval(function() {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                        checkAudioAlerts();
                    } else {
                        // 時間到
                        clearInterval(timerInterval);
                        timerInterval = null;
                        isRunning = false;
                        startBtn.innerText = '開始';
                        startBtn.style.backgroundColor = '#34c759';
                        triggerSound(document.getElementById('sndEnd').value);
                    }
                }, 1000);
            }
        }

        // 檢查聲音提醒觸發點
        function checkAudioAlerts() {
            var mins = Math.floor(timeLeft / 60);
            var secs = timeLeft % 60;
            var alertFreq = document.getElementById('cfgAlertFreq').value;

            // 整分鐘警示 (當秒數為0且分鐘大於0)
            if (secs === 0 && mins > 0) {
                if (alertFreq === 'every') {
                    triggerSound(document.getElementById('sndMin').value);
                } else if (alertFreq === 'standard' && mins <= 3) {
                    triggerSound(document.getElementById('sndMin').value);
                }
            }

            // 最後 10 秒倒數 (1~10 秒)
            if (mins === 0 && secs <= 10 && secs >= 1) {
                triggerSound(document.getElementById('sndSec').value);
            }
        }

        // 重置全場
        function resetAll() {
            initAudio();
            if (isRunning) toggleTimer();
            scores.home = 0;
            scores.guest = 0;
            document.getElementById('homeScore').innerText = '0';
            document.getElementById('guestScore').innerText = '0';
            updateCustomTime();
        }

        // 更新自訂時間
        function updateCustomTime() {
            var inputVal = parseInt(document.getElementById('cfgTime').value, 10);
            if (isNaN(inputVal) || inputVal < 1) inputVal = 10;
            defaultMinutes = inputVal;
            if (!isRunning) {
                timeLeft = defaultMinutes * 60;
                updateTimerDisplay();
            }
        }

        // 側欄切換
        function toggleSettingsLayout() {
            var wrapper = document.getElementById('layoutWrapper');
            var btn = document.getElementById('toggleSettingsBtn');
            if (wrapper.className.indexOf('split-mode') !== -1) {
                wrapper.className = 'layout-wrapper';
                btn.innerText = '⚙ 設定';
            } else {
                wrapper.className = 'layout-wrapper split-mode';
                btn.innerText = '✕ 關閉';
            }
        }

        // 切換背景主題
        function applyBgColor() {
            var color = document.getElementById('cfgBgColor').value;
            document.body.style.backgroundColor = color;
        }

        // 全螢幕切換 (相容 Android 及新版 API)
        function toggleFullScreen() {
            initAudio();
            var doc = window.document;
            var docEl = doc.documentElement;

            var requestAnimationFrame = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            var cancelAnimationFrame = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestAnimationFrame) requestAnimationFrame.call(docEl);
            } else {
                if (cancelAnimationFrame) cancelAnimationFrame.call(doc);
            }
        }

        // 初始化顯示
        updateTimerDisplay();
    </script>
</body>
</html>
